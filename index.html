<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- No frame-ancestors here: a browser ignores it in a meta element, it only works as an
     HTTP header. GitHub Pages sends no custom headers, so it would only log a warning. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laufbursche Firmware Patcher</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">

<link rel="stylesheet" href="styles.css?v=35">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1 class="brand">Laufbursche <span>Firmware Patcher</span></h1>
    <div class="head-tools">
      <button type="button" class="theme-btn" id="themeBtn">&#9728;</button>
      <div class="langs" id="langs" role="group">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>

  <p class="lede" data-t="lede"></p>
  <p class="lede" data-t="ledePrivacy"></p>

  <!-- Outside the numbered steps on purpose: reading the EEPROM has nothing to do with
       which build is being put together, it is run once before a flash and once after. -->
  <section class="eecheck">
    <p class="ee-intro" data-t="eeIntro"></p>
    <button type="button" class="ee-btn" id="eeBtn" data-t="eeBtn"></button>
    <p class="hint" id="eeNoBt" data-t="eeUnsupported" hidden></p>
  </section>

  <section class="step">
    <div class="step-head"><span class="step-num">01</span><h2 class="step-title" data-t="s1"></h2></div>
    <div id="drop" tabindex="0" role="button">
      <strong data-t="dropTitle"></strong>
      <span data-t="dropSub"></span>
    </div>
    <!-- No accept filter on purpose: iOS resolves it to its own file types, does not know
         .hex and greys the file out. What counts is the content check in identify(). -->
    <input type="file" id="file">
    <p class="hint" data-t="uploadHint"></p>
    <p class="hint" data-t="iosHint"></p>
    <div id="check" aria-live="polite"></div>
  </section>

  <div id="patchable">
    <section class="step">
      <div class="step-head"><span class="step-num">02</span><h2 class="step-title" data-t="s2"></h2></div>
      <!-- Options and the description below are filled by the script, so the version number
           and the wording follow the language without two places to keep in step. -->
      <p class="pick-help" data-t="varHelp"></p>
      <ul class="pick-guide" id="varGuide"></ul>
      <label class="pick">
        <span class="pick-label" data-t="varPick"></span>
        <select id="variant"></select>
      </label>
      <h3 class="feat-title" data-t="featTitle"></h3>
      <ul class="features" id="featureList"></ul>
    </section>

    <p class="note" data-t="detailsNote"></p>

    <section class="step" id="stepClamp">
      <div class="step-head"><span class="step-num">03</span><h2 class="step-title" data-t="s3"></h2></div>
      <p class="pick-help" data-t="clampHelp"></p>
      <label class="pick">
        <span class="pick-label" data-t="clampStockLabel"></span>
        <select id="clampStock"></select>
      </label>
      <label class="pick">
        <span class="pick-label" data-t="clampRelockLabel"></span>
        <select id="clampRelock"></select>
      </label>
      <p class="hint" data-t="clampNote"></p>
    </section>

    <section class="step" id="stepBlinker">
      <div class="step-head"><span class="step-num">04</span><h2 class="step-title" data-t="s4"></h2></div>
      <label class="opt">
        <input type="checkbox" id="blinker">
        <span><b data-t="blinkerTitle"></b><p data-t="blinkerText"></p></span>
      </label>
    </section>

    <section class="step">
      <div class="step-head"><span class="step-num">05</span><h2 class="step-title" data-t="s5"></h2></div>
      <p class="note" id="lockNote" data-t="lockNote"></p>
      <button class="build" id="build" data-t="buildBtn"></button>
      <div id="out" aria-live="polite"></div>
    </section>
  </div>

  <footer>
    <span class="foot-links">
      <a href="https://github.com/Laufbursche42/tr-fw" target="_blank" rel="noopener" data-t="source"></a>
      <a id="readmeLink" href="README.md" data-doc="README" data-t="readme"></a>
      <a id="changelogLink" href="CHANGELOG.de.md" data-doc="CHANGELOG" data-t="changelog"></a>
      <a href="#" id="disclaimerLink" data-t="disclaimer"></a>
      <a id="privacyLink" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="privacy"></a>
      <a id="licenseLink" href="LICENSE.de.md" data-doc="LICENSE" data-t="license"></a>
      <a id="trademarksLink" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="trademarks"></a>
    </span>
    <span class="build-id"><span data-t="buildLabel"></span> <span id="pageBuild"></span></span>
  </footer>
</div>

<dialog id="warn">
  <!-- autofocus here, otherwise the browser focuses the buttons at the bottom and
       the scrolling dialog opens somewhere in the middle of the text. -->
  <div class="dlg-body" tabindex="-1" autofocus>
    <h2 data-t="dlgTitle"></h2>
    <p class="dlg-lede" data-t="dlgLede"></p>
    <ul id="dlgList"></ul>
    <label class="consent-row" for="dlgConsent">
      <input type="checkbox" id="dlgConsent">
      <span data-t="dlgConsent"></span>
    </label>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn-cancel" id="dlgNo" data-t="dlgNo"></button>
    <button type="button" class="btn-go" id="dlgYes" disabled data-t="dlgYes"></button>
  </div>
</dialog>

<dialog id="doc" aria-labelledby="docTitle">
  <div class="doc-head">
    <h2 id="docTitle"></h2>
    <button type="button" id="docX">&times;</button>
  </div>
  <div class="doc-body" id="docBody"></div>
  <div class="doc-foot">
    <button type="button" class="btn-cancel" id="docClose" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="ee" aria-labelledby="eeTitle">
  <div class="doc-head">
    <h2 id="eeTitle" data-t="eeTitle"></h2>
    <button type="button" id="eeX">&times;</button>
  </div>
  <div class="doc-body">
    <p class="ee-status" id="eeStatus" aria-live="polite"></p>
    <p class="ee-read" data-t="eeReadOnly"></p>
    <!-- Three sections, all built by the script: labels, live values and the factory
         column all follow the language; only the script knows which gears were
         reported and which identity frames arrived. First the scooter's own identity,
         not EEPROM settings but useful to have beside them; then the gear table, one
         column per gear and one row per value; then the values that belong to no gear. -->
    <div class="ee-sec" id="eeIdentitySec"></div>
    <div class="ee-list" id="eeIdentityList"></div>
    <div class="ee-sec" id="eeGearSec"></div>
    <div class="ee-tab-wrap" id="eeGearTable"></div>
    <div class="ee-sec" id="eeGlobalSec"></div>
    <div class="ee-list" id="eeList"></div>
    <p class="hint" id="eeCopied" aria-live="polite"></p>
  </div>
  <div class="doc-foot">
    <button type="button" class="btn-go" id="eeCopy" data-t="eeCopy"></button>
    <button type="button" class="btn-cancel" id="eeClose" data-t="docClose"></button>
  </div>
</dialog>

<script src="patcher.js?v=35"></script>
<script src="i18n.js?v=35"></script>
<script src="ble.js?v=35"></script>
<script src="page.js?v=35"></script>
</body>
</html>
