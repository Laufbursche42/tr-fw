<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laufbursche Firmware Patcher</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">

<style>
/* Palette taken from the Laufbursche Edition dashboard, so the tool and the app
   look like one family. Deliberately dark only, the way the app is. */
:root {
  --bg:       #0A0C10;
  --card:     #111420;
  --border:   #1C2035;
  --text:     #E4EDF6;
  --label:    #C6D2E2;
  --accent:   #B8F020;
  --accent-2: #E8730C;
  --good:     #1EE89A;
  --warn:     #FFAA18;
  --danger:   #FF5050;
  --radius:   12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.6rem; }
.brand { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.brand span { color: var(--accent); }
.langs { display: flex; gap: .25rem; }
.langs button {
  font: 600 .75rem/1 var(--mono); letter-spacing: .05em; padding: .45rem .6rem;
  background: transparent; color: var(--label); border: 1px solid var(--border);
  border-radius: .35rem; cursor: pointer;
}
.langs button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.langs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.lede { color: var(--label); margin: 0 0 .7rem; }
.lede:last-of-type { margin-bottom: 2rem; }

.step { margin-bottom: 1.75rem; }
.step-head { display: flex; align-items: baseline; gap: .55rem; margin-bottom: .65rem; }
.step-num { font: 700 .68rem/1 var(--mono); letter-spacing: .1em; color: var(--accent); }
.step-title { font-size: 1rem; font-weight: 600; margin: 0; }

.cards { display: grid; gap: .6rem; grid-template-columns: 1fr; }
@media (min-width: 34rem) { .cards { grid-template-columns: 1fr 1fr; } }
.card {
  display: block; position: relative; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: .9rem 1rem; cursor: pointer;
}
.card:has(input:checked) { border-color: var(--accent); }
.card:has(input:disabled) { opacity: .62; cursor: default; }
.card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.card input { position: absolute; opacity: 0; pointer-events: none; }
.card b { display: block; font-size: .97rem; }
.card .meta { font: .68rem/1.6 var(--mono); letter-spacing: .05em; color: var(--accent); text-transform: uppercase; }
.card p { margin: .35rem 0 0; color: var(--label); font-size: .87rem; }
.card .dl { display: inline-block; margin-top: .55rem; font-size: .83rem; color: var(--accent); }
.card .dl:hover { text-decoration: underline; }

#drop {
  border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 1.5rem 1rem;
  text-align: center; cursor: pointer; background: var(--card);
  transition: border-color .15s;
}
#drop:hover, #drop.over { border-color: var(--accent); }
#drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#drop strong { display: block; margin-bottom: .2rem; font-size: .97rem; }
#drop span { color: var(--label); font-size: .87rem; }
input[type=file] { display: none; }
.hint { color: var(--label); font-size: .86rem; margin: .6rem 0 0; }
.hint a, .note a { color: var(--accent); }
#check:not(:empty) { margin-top: .8rem; }
.verdict { border: 1px solid var(--border); border-left: 3px solid var(--good);
  background: var(--card); border-radius: .4rem; padding: .7rem .9rem; font-size: .88rem; }
.verdict.bad { border-left-color: var(--danger); }
.verdict b { color: var(--text); }
.verdict .detail { display: block; margin-top: .3rem; font: .8rem/1.5 var(--mono); color: var(--label); }

.feat-title { font-size: .9rem; font-weight: 600; margin: 1.1rem 0 .5rem; color: var(--label); text-align: center; }
.features { margin: 0; padding: 0; list-style: none; display: grid; gap: .3rem; text-align: center; }
.features li { font-size: .88rem; color: var(--label); }

.opt { display: flex; align-items: flex-start; gap: .6rem; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius); padding: .85rem 1rem; cursor: pointer; }
.opt input { margin: .2rem 0 0; accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
.opt b { font-size: .95rem; font-weight: 600; }
.opt p { margin: .2rem 0 0; color: var(--label); font-size: .86rem; }

.note {
  border: 1px solid var(--border); border-left: 3px solid var(--warn);
  background: var(--card); border-radius: .4rem; padding: .8rem 1rem; margin: 0 0 1.1rem;
  color: var(--label); font-size: .89rem;
}
.note b { color: var(--text); }

button.build {
  display: block; margin: 0 auto;
  font: 700 1rem/1 inherit; padding: .85rem 1.6rem; border: 0; border-radius: .45rem;
  background: var(--accent); color: #0A0C10; cursor: pointer;
}
button.build:disabled { opacity: .4; cursor: not-allowed; }
button.build:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

#out:not(:empty) { margin-top: 1.1rem; }
.report { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--good);
  border-radius: .4rem; padding: .9rem 1rem; }
.report.bad { border-left-color: var(--danger); }
.report h3 { margin: 0 0 .6rem; font-size: .97rem; }
.report.bad h3 { color: var(--danger); }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .9rem; margin: 0 0 .8rem; }
dl.facts dt { color: var(--label); font-size: .84rem; }
dl.facts dd { margin: 0; font: .84rem/1.5 var(--mono); font-variant-numeric: tabular-nums; }
a.get { display: inline-block; font-weight: 700; color: var(--accent); }
pre.err { background: #0A0D18; border-radius: .35rem; padding: .7rem .8rem; overflow-x: auto;
  font: .82rem/1.5 var(--mono); margin: 0; color: var(--danger); }

dialog {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
  color: var(--text); max-width: 32rem; width: calc(100% - 2rem); padding: 0;
}
dialog::backdrop { background: rgba(0,0,0,.72); }
.dlg-body { padding: 1.25rem 1.25rem 0; }
.dlg-body:focus { outline: none; }   /* focused only to open the dialog at the top */
.dlg-body h2 { margin: 0 0 .7rem; font-size: 1.05rem; color: var(--warn); }
.dlg-body ul { margin: 0 0 .9rem; padding-left: 1.15rem; color: var(--label); font-size: .9rem; }
.dlg-body .dlg-lede { margin: 0 0 .8rem; color: var(--label); font-size: .9rem; }
.dlg-body li b { color: var(--text); }
.dlg-body li.unverified { color: var(--warn); }
.dlg-body li.unverified b { color: var(--warn); }
dialog { max-height: 88vh; overflow-y: auto; }
.dlg-body li { margin-bottom: .45rem; }
.dlg-foot { display: flex; gap: .6rem; justify-content: center; padding: 0 1.25rem 1.25rem; }
.dlg-foot button { font: 600 .92rem/1 inherit; padding: .7rem 1.1rem; border-radius: .4rem; cursor: pointer; }
.btn-cancel { background: transparent; color: var(--label); border: 1px solid var(--border); }
.btn-go { background: var(--accent-2); color: #0A0C10; border: 0; }
.dlg-foot button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Document viewer: the texts belong to this page, so they open here instead of
   sending the reader to a code host. Head and foot stay put, the text scrolls. */
#doc { max-width: 44rem; max-height: 88vh; overflow: hidden; }
/* Only the open dialog is a flex column: a display value on the closed one would
   beat the browser's display:none and drop the whole thing into the page. */
#doc[open] { display: flex; flex-direction: column; }
.doc-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
.doc-head h2 { margin: 0; font-size: 1rem; }
#docX { background: none; border: 0; color: var(--label); font: 1.5rem/1 inherit;
  padding: 0 .2rem; cursor: pointer; }
#docX:hover { color: var(--accent); }
#docX:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.doc-body { padding: 1.1rem 1.25rem; overflow-y: auto; color: var(--label); font-size: .9rem; }
.doc-body > :first-child { margin-top: 0; }
.doc-body h1 { font-size: 1.05rem; color: var(--text); margin: 0 0 .9rem; }
.doc-body h2 { font-size: .95rem; color: var(--accent); margin: 1.5rem 0 .5rem; }
.doc-body h3, .doc-body h4 { font-size: .9rem; color: var(--text); margin: 1.2rem 0 .4rem; }
.doc-body p { margin: 0 0 .8rem; }
.doc-body ul, .doc-body ol { margin: 0 0 .9rem; padding-left: 1.2rem; }
.doc-body li { margin-bottom: .35rem; }
.doc-body b { color: var(--text); }
.doc-body li.unverified, .doc-body li.unverified b { color: var(--warn); }
.doc-body a { color: var(--accent); }
.doc-body code { font: .85em var(--mono); background: #0d1018; border: 1px solid var(--border);
  border-radius: .25rem; padding: .05rem .3rem; }
.doc-body pre { background: #0d1018; border: 1px solid var(--border); border-radius: .4rem;
  padding: .75rem .9rem; margin: 0 0 .9rem; overflow-x: auto; }
.doc-body pre code { border: 0; background: none; padding: 0; font-size: .78rem; line-height: 1.55; }
.doc-body hr { border: 0; border-top: 1px solid var(--border); margin: 1.3rem 0; }
.doc-body blockquote { margin: 0 0 .9rem; padding-left: .8rem; color: #8a93a8;
  border-left: 2px solid var(--border); }
.doc-foot { display: flex; justify-content: center; padding: .9rem 1.25rem;
  border-top: 1px solid var(--border); }
.doc-foot button { font: 600 .92rem/1 inherit; padding: .7rem 1.4rem; border-radius: .4rem; cursor: pointer; }
.doc-foot button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

footer { margin-top: 2.5rem; padding-top: 1.1rem; border-top: 1px solid var(--border);
  color: var(--label); font-size: .84rem;
  display: flex; gap: .5rem 1rem; align-items: baseline; }
footer a { color: var(--accent); }
.foot-links { display: flex; flex-wrap: wrap; gap: .4rem 1rem; }
/* The build keeps the first line and the far right, the links wrap under themselves. */
.build-id { font: .84rem/1.4 var(--mono); color: #5c6478; letter-spacing: .06em;
  margin-left: auto; white-space: nowrap; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1 class="brand">Laufbursche <span>Firmware Patcher</span></h1>
    <div class="langs" role="group" aria-label="Sprache">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <p class="lede" data-t="lede"></p>
  <p class="lede" data-t="ledePrivacy"></p>

  <section class="step">
    <div class="step-head"><span class="step-num">01</span><h2 class="step-title" data-t="s1"></h2></div>
    <div id="drop" tabindex="0" role="button">
      <strong data-t="dropTitle"></strong>
      <span data-t="dropSub"></span>
    </div>
    <input type="file" id="file" accept=".hex,text/plain">
    <p class="hint" data-t="uploadHint"></p>
    <div id="check" aria-live="polite"></div>
  </section>

  <div id="patchable">
    <section class="step">
      <div class="step-head"><span class="step-num">02</span><h2 class="step-title" data-t="s2"></h2></div>
      <div class="cards">
        <label class="card">
          <input type="radio" name="variant" value="standard" checked>
          <span class="meta" id="tagStd"></span>
          <b data-t="varStdTitle"></b>
          <p data-t="varStdText"></p>
        </label>
        <label class="card">
          <input type="radio" name="variant" value="kickstart">
          <span class="meta" id="tagKick"></span>
          <b data-t="varKickTitle"></b>
          <p data-t="varKickText"></p>
        </label>
      </div>
      <h3 class="feat-title" data-t="featTitle"></h3>
      <ul class="features" id="featureList"></ul>
    </section>

    <p class="note" data-t="detailsNote"></p>

    <section class="step">
      <div class="step-head"><span class="step-num">03</span><h2 class="step-title" data-t="s3"></h2></div>
      <label class="opt">
        <input type="checkbox" id="blinker">
        <span><b data-t="blinkerTitle"></b><p data-t="blinkerText"></p></span>
      </label>
    </section>

    <section class="step">
      <div class="step-head"><span class="step-num">04</span><h2 class="step-title" data-t="s4"></h2></div>
      <p class="note" data-t="lockNote"></p>
      <button class="build" id="build" data-t="buildBtn"></button>
      <div id="out" aria-live="polite"></div>
    </section>
  </div>

  <footer>
    <span class="foot-links">
      <a href="https://github.com/Laufbursche42/tr-fw" target="_blank" rel="noopener" data-t="source"></a>
      <a id="changelogLink" href="CHANGELOG.de.md" data-doc="CHANGELOG" data-t="changelog"></a>
      <a href="#" id="disclaimerLink" data-t="disclaimer"></a>
      <a id="privacyLink" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="privacy"></a>
      <a id="licenseLink" href="LICENSE.de.md" data-doc="LICENSE" data-t="license"></a>
      <a id="trademarksLink" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="trademarks"></a>
    </span>
    <span class="build-id"><span data-t="buildLabel"></span> <span id="pageBuild"></span></span>
  </footer>
</div>

<dialog id="warn">
  <!-- autofocus here, otherwise the browser focuses the buttons at the bottom and
       the scrolling dialog opens somewhere in the middle of the text. -->
  <div class="dlg-body" tabindex="-1" autofocus>
    <h2 data-t="dlgTitle"></h2>
    <p class="dlg-lede" data-t="dlgLede"></p>
    <ul id="dlgList"></ul>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn-cancel" id="dlgNo" data-t="dlgNo"></button>
    <button type="button" class="btn-go" id="dlgYes" data-t="dlgYes"></button>
  </div>
</dialog>

<dialog id="doc" aria-labelledby="docTitle">
  <div class="doc-head">
    <h2 id="docTitle"></h2>
    <button type="button" id="docX">&times;</button>
  </div>
  <div class="doc-body" id="docBody"></div>
  <div class="doc-foot">
    <button type="button" class="btn-cancel" id="docClose" data-t="docClose"></button>
  </div>
</dialog>

<script src="patcher.js?v=7"></script>
<script src="i18n.js?v=7"></script>
<script src="page.js?v=7"></script>
</body>
</html>
